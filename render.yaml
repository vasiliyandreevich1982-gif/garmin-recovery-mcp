services:
  - type: web
    name: garmin-recovery-mcp
    rootDir: .
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand:    sh -c 'pwd && ls -la && python -c "import server" && uvicorn server:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    autoDeployTrigger: commit
